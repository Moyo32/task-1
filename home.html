<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Hero</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <section class="h-screen w-full bg-red-400 from-[#dfa17e] to-[#f7cbd0] overflow-hidden">

        <div class="h-full max-w-7xl mx-auto flex items-center justify-between px-12">

            <div class="w-1/2">

                <p class="text-2xl text-gray-700 mb-2">
                    Simple and
                </p>

                <h1 class="text-7xl font-bold text-gray-800 mb-6">
                    Classy
                </h1>

                <p class="text-xs text-gray-600 w-72 leading-4 mb-8">
                    It is a long established fact that a reader will be distracted by
                    the readable content of a page when looking at its layout.
                </p>

                <div class="flex gap-3">

                    <button class="bg-gray-800 text-white text-xs px-6 py-2 rounded-full hover:bg-gray-700">
                        Buy Now
                    </button>

                    <button class="border border-gray-600 text-gray-700 text-xs px-6 py-2 rounded-full hover:bg-white">
                        Shop All
                    </button>

                </div>

            </div>



        </div>

        </div>

    </section>
