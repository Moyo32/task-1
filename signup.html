<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-600">

    <nav>
        <div class="bg-black h-30 w-full mx-auto px-4 py-3 flex items-center justify-between">
            <div>
                <img
                    src="https://plus.unsplash.com/premium_photo-1789200609735-874013ebe02b?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt=""
                    class="size-20 rounded-full"
                >
            </div>

            <div>
                <ul class="flex justify-between items-center gap-3 text-[18px]">
                    <li><a href="./home.html" class="text-white hover:text-red-900">Home</a></li>
                    <li><a href="./about.html" class="text-white hover:text-red-900">About</a></li>
                    <li><a href="./contact.html" class="text-white hover:text-red-900">Contact</a></li>
                </ul>
            </div>

            <div>
                <ul>
                    <a href="./signin.html" class="text-white hover:text-red-900">Sigin</a>
                    <a href="./signup.html" class="text-white hover:text-red-900"> / Signup</a>
                </ul>
            </div>
        </div>
    </nav>

    <section class="max-w-md mx-auto px-6 py-16">
        <h1 class="text-3xl font-bold mb-2 text-center">Create your account</h1>
        <p class="text-sm text-white text-center mb-8">
            Join ElectroX for early access to drops and member-only pricing.
        </p>

        <ul class="space-y-2 mb-8 text-sm text-white">
            <li class="flex items-center gap-2"><span class="text-black font-bold">✓</span> Early access to new collections</li>
            <li class="flex items-center gap-2"><span class="text-black font-bold">✓</span> Member-only discounts</li>
            <li class="flex items-center gap-2"><span class="text-black font-bold">✓</span> Free returns on every order</li>
        </ul>

        <form class="space-y-4" action="#" method="POST">

            <div>
                <label for="full_name" class="block mb-1 text-sm font-medium text-gray-900">Full name</label>
                <input type="text" id="full_name" name="full_name" required minlength="2"
                       class="bg-white border border-gray-300 text-sm rounded-lg block w-full p-2.5 focus:ring-gray-800 focus:border-gray-800">
            </div>

            <div>
                <label for="signup_email" class="block mb-1 text-sm font-medium text-gray-900">Email</label>
                <input type="email" id="signup_email" name="email" required
                       class="bg-white border border-gray-300 text-sm rounded-lg block w-full p-2.5 focus:ring-gray-800 focus:border-gray-800"
                       placeholder="you@example.com">
            </div>

            <div>
                <label for="signup_password" class="block mb-1 text-sm font-medium text-gray-900">Password</label>
                <input type="password" id="signup_password" name="password" required minlength="8"
                       title="At least 8 characters"
                       class="bg-white border border-gray-300 text-sm rounded-lg block w-full p-2.5 focus:ring-gray-800 focus:border-gray-800"
                       placeholder="At least 8 characters">
            </div>

            <div class="flex items-start gap-2 bg-white border border-gray-200 rounded-lg p-3">
                <input id="terms" type="checkbox" required class="mt-1">
                <label for="terms" class="text-xs text-gray-600">
                    I agree to the
                    <a href="#" class="underline">Terms of Service</a>
                    and
                    <a href="#" class="underline">Privacy Policy</a>.
                </label>
            </div>

            <button type="submit"
                    class="w-full bg-gray-900 text-white text-sm font-medium rounded-lg px-6 py-3 hover:bg-gray-700 transition">
                Create account
            </button>
        </form>

        <p class="text-white text-center mt-6">
            Already have an account?
            <a href="./signin.html" class="font-medium underline hover:text-red-900">Sign in</a>
        </p>
    </section>

</body>

</html>
