<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-600">

    <nav>
        <div class="bg-black h-30 w-full mx-auto px-4 py-3 flex items-center justify-between">
            <div>
                <img
                    src="https://plus.unsplash.com/premium_photo-1789200609735-874013ebe02b?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt=""
                    class="size-20 rounded-full"
                >
            </div>

            <div>
                <ul class="flex justify-between items-center gap-3 text-[18px]">
                    <li><a href="./home.html" class="text-white hover:text-red-900">Home</a></li>
                    <li><a href="./about.html" class="text-white hover:text-red-900">About</a></li>
                    <li><a href="./contact.html" class="text-white hover:text-red-900">Contact</a></li>
                </ul>
            </div>

            <div>
                <ul>
                    <a href="./signin.html" class="text-white hover:text-red-900">Sigin</a>
                    <a href="./signup.html" class="text-white hover:text-red-900"> / Signup</a>
                </ul>
            </div>
        </div>
    </nav>

    <section class="max-w-md mx-auto px-6 py-16">
        <h1 class="text-4xl font-bold mb-3 text-center">Welcome back</h1>
        <p class="text-white text-center mb-10">
            Sign in to view your orders and check out faster.
        </p>

        <form action="#" method="POST" class="space-y-5">
            <div>
                <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email address</label>
                <input type="email" id="email" name="email" required
                       title="Please enter a valid email address"
                       class="w-full px-3 py-2 rounded-lg bg-white">
            </div>

            <div>
                <label for="password" class="block mb-2 text-sm font-medium text-gray-900">Password</label>
                <input type="password" id="password" name="password" required minlength="6"
                       title="Please enter at least 6 characters"
                       class="w-full px-3 py-2 rounded-lg bg-white">
            </div>

            <div class="flex items-center justify-between text-sm text-white">
                <label class="flex items-center gap-2">
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
                <a href="#" class="hover:underline">Forgot password?</a>
            </div>

            <button type="submit" class="w-full text-white bg-gray-900 hover:bg-gray-700 font-medium rounded-lg text-sm px-6 py-3">
                Sign in
            </button>
        </form>

        <p class="text-white text-center mt-6">
            Don't have an account?
            <a href="./signup.html" class="font-medium underline hover:text-red-900">Sign up</a>
        </p>
    </section>

</body>

</html>
