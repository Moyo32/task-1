    <section class="max-w-6xl mx-auto px-6 py-16">
        <h1 class="text-4xl font-bold mb-3 text-center">Get in touch</h1>
        <p class="text-white text-gray-600 text-center max-w-lg mx-auto mb-12">
            Questions about an order, a return, or a partnership? We reply within one business day.
        </p>
        <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-5">
          <div>
                    <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Full name</label>
                    <input type="text" id="name" name="name" required minlength="2"
                           title="Please enter at least 2 characters">
                </div>
    <div>
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email address</label>
                    <input type="email" id="email" name="email" required
                           title="Please enter a valid email address">
    </div>

    <div>
                    <label for="message" class="block mb-2 text-sm font-medium text-gray-900">Message</label>
                    <textarea id="message" name="message" rows="4" required minlength="10"
                              title="Please enter at least 10 characters" >   </textarea>  </div> 

         <button type="submit" class="text-white bg-gray-900 hover:bg-gray-700 font-medium rounded-lg text-sm px-6 py-3">
                    Send message
                </button>
            </form>
