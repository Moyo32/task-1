<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-600">

    <nav>
        <div class="bg-black h-30 w-full mx-auto px-4 py-3 flex items-center justify-between">
            <div>
                <img
                    src="https://plus.unsplash.com/premium_photo-1789200609735-874013ebe02b?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                    alt=""
                    class="size-20 rounded-full"
                >
            </div>

            <div>
                <ul class="flex justify-between items-center gap-3 text-[18px]">
                    <li><a href="./home.html" class="text-white hover:text-red-900">Home</a></li>
                    <li><a href="./about.html" class="text-white hover:text-red-900">About</a></li>
                    <li><a href="./contact.html" class="text-white hover:text-red-900">Contact</a></li>
                </ul>
            </div>

            <div>
                <ul>
                    <a href="./signin.html" class="text-white hover:text-red-900">Sigin</a>
                    <a href="./signup.html" class="text-white hover:text-red-900"> / Signup</a>
                </ul>
            </div>
        </div>
    </nav>

    <section class="max-w-6xl mx-auto px-6 py-16">
        <h1 class="text-4xl font-bold mb-3 text-center">Get in touch</h1>
        <p class="text-white text-gray-600 text-center max-w-lg mx-auto mb-12">
            Questions about an order, a return, or a partnership? We reply within one business day.
        </p>

        <div class="grid md:grid-cols-2 gap-12">

            <!-- LEFT: form -->
            <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-5">
                <div>
                    <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Full name</label>
                    <input type="text" id="name" name="name" required minlength="2"
                           title="Please enter at least 2 characters"
                           class="w-full">
                </div>

                <div>
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900">Email address</label>
                    <input type="email" id="email" name="email" required
                           title="Please enter a valid email address"
                           class="w-full">
                </div>

                <div>
                    <label for="message" class="block mb-2 text-sm font-medium text-gray-900">Message</label>
                    <textarea id="message" name="message" rows="4" required minlength="10"
                              title="Please enter at least 10 characters"
                              class="w-full"></textarea>
                </div>

                <button type="submit" class="text-white bg-gray-900 hover:bg-gray-700 font-medium rounded-lg text-sm px-6 py-3">
                    Send message
                </button>
            </form>

            <!-- RIGHT: contact details -->
            <div class="space-y-6 text-white">
                <div>
                    <h3 class="text-sm font-medium text-gray-900 mb-1">Address</h3>
                    <p>123 Main Street, Lahore, Pakistan</p>
                </div>

                <div>
                    <h3 class="text-sm font-medium text-gray-900 mb-1">Email</h3>
                    <a href="mailto:support@electrox.com" class="hover:underline">support@electrox.com</a>
                </div>

                <div>
                    <h3 class="text-sm font-medium text-gray-900 mb-1">Phone</h3>
                    <a href="tel:+920000000000" class="hover:underline">+92 325 3255231</a>
                </div>
            </div>

        </div>
    </section>

</body>

</html>
